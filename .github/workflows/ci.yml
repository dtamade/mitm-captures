name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  runtime-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            entrypoint: shell
          - os: macos-latest
            entrypoint: shell
          - os: windows-latest
            entrypoint: windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install mitmproxy
        run: python -m pip install --upgrade pip && python -m pip install mitmproxy==12.2.1

      - name: Validate shell syntax
        if: matrix.entrypoint == 'shell'
        run: |
          bash -n startCaptures.sh
          bash -n stopCaptures.sh
          bash -n analyzeLatest.sh
          bash -n ai.sh

      - name: Validate Python syntax
        run: |
          python -m py_compile .har_addon.py
          python -m py_compile flow2har.py
          python -m py_compile flow_report.py
          python -m py_compile ai_brief.py
          python -m py_compile tests/runtime_smoke.py

      - name: Run static test suite
        run: python -m unittest discover -s tests

      - name: Run runtime smoke test
        timeout-minutes: 5
        run: python tests/runtime_smoke.py --entrypoint ${{ matrix.entrypoint }}
