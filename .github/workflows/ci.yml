name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  runtime-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            entrypoint: shell
            smoke_run: python tests/runtime_smoke.py --entrypoint shell --proxy-mode program
          - os: ubuntu-latest
            entrypoint: shell
            smoke_run: TMP_HOME="$(mktemp -d)" && mkdir -p "$TMP_HOME/.config" "$TMP_HOME/.local/share" && XDG_CONFIG_HOME="$TMP_HOME/.config" XDG_DATA_HOME="$TMP_HOME/.local/share" dbus-run-session -- python tests/runtime_smoke.py --entrypoint shell --proxy-mode system
          - os: macos-latest
            entrypoint: shell
            smoke_run: python tests/runtime_smoke.py --entrypoint shell --proxy-mode program
          - os: windows-latest
            entrypoint: windows
            smoke_run: python tests/runtime_smoke.py --entrypoint windows --proxy-mode program
          - os: windows-latest
            entrypoint: windows
            smoke_run: python tests/runtime_smoke.py --entrypoint windows --proxy-mode system --exercise-install --exercise-cert
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install mitmproxy
        run: python -m pip install --upgrade pip && python -m pip install mitmproxy==12.2.1

      - name: Validate shell syntax
        if: matrix.entrypoint == 'shell'
        run: |
          bash -n startCaptures.sh
          bash -n stopCaptures.sh
          bash -n analyzeLatest.sh
          bash -n ai.sh

      - name: Validate Python syntax
        run: |
          python -m py_compile .har_addon.py
          python -m py_compile flow2har.py
          python -m py_compile flow_report.py
          python -m py_compile ai_brief.py
          python -m py_compile state_import.py
          python -m py_compile tests/runtime_smoke.py

      - name: Run static test suite
        run: python -m unittest discover -s tests

      - name: Run runtime smoke test
        timeout-minutes: 5
        run: ${{ matrix.smoke_run }}
